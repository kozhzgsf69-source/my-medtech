<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>МедТех: Анкета пациента</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 500px; margin: 30px auto; padding: 20px; background: #f4f7f6; color: #2c3e50; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .hidden { display: none; }
        .sub { margin-top: 15px; padding: 15px; border-left: 4px solid #3498db; background: #f9f9f9; border-radius: 4px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        select, input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #dcdde1; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 16px; background: #2ecc71; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
        #status { text-align: center; margin-top: 20px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <h2 style="text-align: center;">Анкета перед приемом</h2>
    
    <div class="card">
        <label>Ваше ФИО:</label>
        <input type="text" id="patient_name" placeholder="Иванов Иван Иванович">
    </div>

    <form id="anketaForm">
        <div class="card">
            <h3>Кардио-система</h3>
            <label>Беспокоят боли в груди?</label>
            <select id="c_pain" onchange="toggleBranch('c_pain', 'c_box')">
                <option value="no">Нет</option>
                <option value="yes">Да</option>
            </select>
            
            <div id="c_box" class="hidden sub">
                <label>Локализация:</label>
                <select id="c_loc">
                    <option value="За грудиной">За грудиной</option>
                    <option value="В области сердца">В области сердца</option>
                </select>
                <label>Характер боли:</label>
                <select id="c_char">
                    <option value="Давящая">Давящая</option>
                    <option value="Колющая">Колющая</option>
                </select>
            </div>
        </div>

        <button type="button" onclick="sendData()">Отправить врачу</button>
        <div id="status"></div>
    </form>

    <script>
        function toggleBranch(selectId, branchId) {
            const select = document.getElementById(selectId);
            const branch = document.getElementById(branchId);
            branch.classList.toggle('hidden', select.value === 'no');
        }

        async function sendData() {
            const status = document.getElementById('status');
            const name = document.getElementById('patient_name').value.trim() || "Аноним";
            let results = [];

            if (document.getElementById('c_pain').value === 'yes') {
                const loc = document.getElementById('c_loc').value;
                const char = document.getElementById('c_char').value;
                results.push("Кардио: " + loc + ", " + char);
            }

            if (results.length === 0) results.push("Жалоб нет");

            status.innerText = "⏳ Отправка данных...";
            status.style.color = "blue";

            const data = {
                name: name,
                results: results,
                timestamp: Date.now()
            };

            try {
                // ИСПРАВЛЕНО: Полный путь к базе + .json в конце
                const response = await fetch("https://medformproject-default-rtdb.firebaseio.com/anketa.json", {
                    method: "POST",
                    body: JSON.stringify(data),
                    headers: { "Content-Type": "application/json" }
                });

                if (response.ok) {
                    status.innerText = "✅ Успешно доставлено!";
                    status.style.color = "green";
                    document.getElementById('anketaForm').reset();
                    document.getElementById('c_box').classList.add('hidden');
                } else {
                    throw new Error("Ошибка сервера");
                }
            } catch (error) {
                status.innerText = "❌ Ошибка: проверьте интернет или правила базы данных";
                status.style.color = "red";
                console.error(error);
            }
        }
    </script>
</body>
</html>
