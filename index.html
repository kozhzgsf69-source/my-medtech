<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедТех: Анкета с ИИ-вводом</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            max-width: 550px;
            margin: 20px auto;
            padding: 20px;
            background: #f4f7f6;
            color: #2c3e50;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }

        .sub {
            margin-top: 15px;
            padding: 15px;
            border-left: 4px solid #3498db;
            background: #f9f9f9;
            border-radius: 4px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select,
        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 16px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .mic-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #e74c3c;
            border: none;
            font-size: 24px;
            color: white;
            cursor: pointer;
            display: block;
            margin: 0 auto;
            transition: 0.3s;
        }

        .recording {
            background: #c0392b;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.7);
            transform: scale(1.1);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }

            100% {
                opacity: 1;
            }
        }

        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2 style="text-align: center;">Анкета пациента</h2>

    <div class="card">
        <label>Ваше ФИО:</label>
        <input type="text" id="p_name" placeholder="Введите имя">
    </div>

    <div class="card">
        <h3>1. Жалобы (тест)</h3>
        <label>Беспокоят боли в груди?</label>
        <select id="c_pain" onchange="document.getElementById('c_box').classList.toggle('hidden', this.value === 'no')">
            <option value="no">Нет</option>
            <option value="yes">Да</option>
        </select>
        <div id="c_box" class="hidden sub">
            <label>Локализация:</label>
            <select id="c_loc">
                <option value="За грудиной">За грудиной</option>
                <option value="Слева">Слева</option>
            </select>
            <label>Характер:</label>
            <select id="c_char">
                <option value="Давящая">Давящая</option>
                <option value="Колющая">Колющая</option>
            </select>
        </div>
    </div>

    <div class="card">
        <h3>2. Рассказать подробно (Голос)</h3>
        <p style="font-size: 0.9em; text-align: center; color: #7f8c8d;">Нажмите на микрофон и опишите проблему своими
            словами.</p>
        <button type="button" id="mic-btn" class="mic-btn">🎤</button>
        <div id="rec-indicator"
            style="text-align: center; margin: 10px 0; color: #e74c3c; font-weight: bold; visibility: hidden;">ЗАПИСЬ
            ИДЕТ...</div>
        <textarea id="voice_text" rows="4" placeholder="Текст вашей речи появится здесь..."></textarea>
    </div>

    <button onclick="sendData()">Отправить врачу</button>
    <div id="status"></div>

    <script>
        // 1. ЛОГИКА МИКРОФОНА (Ультра-стабильная версия v3)
        const micBtn = document.getElementById('mic-btn');
        const voiceArea = document.getElementById('voice_text');
        const indicator = document.getElementById('rec-indicator');

        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (Speech) {
            const rec = new Speech();
            rec.lang = 'ru-RU';
            rec.continuous = true;      // Не останавливаться после одной фразы
            rec.interimResults = true;  // Показывать текст в процессе распознавания

            let isRecording = false;

            micBtn.onclick = () => {
                if (!isRecording) {
                    try {
                        rec.start();
                        isRecording = true;
                        micBtn.classList.add('recording');
                        indicator.style.visibility = 'visible';
                        indicator.innerText = "СЛУШАЮ... ГОВОРИТЕ";
                    } catch (e) { console.error(e); }
                } else {
                    rec.stop();
                    isRecording = false;
                    micBtn.classList.remove('recording');
                    indicator.style.visibility = 'hidden';
                }
            };

         rec.onresult = (event) => {
    let finalTranscript = '';
    
    for (let i = event.resultIndex; i < event.results.length; ++i) {
        // Добавляем проверку, что данные вообще существуют
        if (event.results[i] && event.results[i][0]) {
            let text = event.results[i][0].transcript; // Добавили индекс [0]
            if (event.results[i].isFinal) {
                finalTranscript += text;
            }
        }
    }

    if (finalTranscript) {
        // Убираем слово undefined и просто склеиваем текст
        voiceArea.value = (voiceArea.value + ' ' + finalTranscript).trim();
    }
};

                // Если есть финальный текст — добавляем его в поле навсегда
                if (finalTranscript) {
                    voiceArea.value += (voiceArea.value ? ' ' : '') + finalTranscript;
                }

                // Временная подсказка, чтобы пациент видел, что его слышат
                if (interimTranscript) {
                    indicator.innerText = "РАСПОЗНАЮ: " + interimTranscript;
                } else {
                    indicator.innerText = "СЛУШАЮ... ГОВОРИТЕ";
                }
            };

            rec.onerror = (event) => {
                indicator.innerText = "ОШИБКА: " + event.error;
                console.error(event.error);
            };

        } else {
            micBtn.style.display = 'none';
            voiceArea.placeholder = "Браузер не поддерживает голос.";
        }

    </script>
</body>

</html>
