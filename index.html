<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедТех: Анкета с ИИ-вводом</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            max-width: 550px;
            margin: 20px auto;
            padding: 20px;
            background: #f4f7f6;
            color: #2c3e50;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }

        .sub {
            margin-top: 15px;
            padding: 15px;
            border-left: 4px solid #3498db;
            background: #f9f9f9;
            border-radius: 4px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select,
        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 16px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .mic-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #e74c3c;
            border: none;
            font-size: 24px;
            color: white;
            cursor: pointer;
            display: block;
            margin: 0 auto;
            transition: 0.3s;
        }

        .recording {
            background: #c0392b;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.7);
            transform: scale(1.1);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }

            100% {
                opacity: 1;
            }
        }

        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2 style="text-align: center;">Анкета пациента</h2>

    <div class="card">
        <label>Ваше ФИО:</label>
        <input type="text" id="p_name" placeholder="Введите имя">
    </div>

    <div class="card">
        <h3>1. Жалобы (тест)</h3>
        <label>Беспокоят боли в груди?</label>
        <select id="c_pain" onchange="document.getElementById('c_box').classList.toggle('hidden', this.value === 'no')">
            <option value="no">Нет</option>
            <option value="yes">Да</option>
        </select>
        <div id="c_box" class="hidden sub">
            <label>Локализация:</label>
            <select id="c_loc">
                <option value="За грудиной">За грудиной</option>
                <option value="Слева">Слева</option>
            </select>
            <label>Характер:</label>
            <select id="c_char">
                <option value="Давящая">Давящая</option>
                <option value="Колющая">Колющая</option>
            </select>
        </div>
    </div>

    <div class="card">
        <h3>2. Рассказать подробно (Голос)</h3>
        <p style="font-size: 0.9em; text-align: center; color: #7f8c8d;">Нажмите на микрофон и опишите проблему своими
            словами.</p>
        <button type="button" id="mic-btn" class="mic-btn">🎤</button>
        <div id="rec-indicator"
            style="text-align: center; margin: 10px 0; color: #e74c3c; font-weight: bold; visibility: hidden;">ЗАПИСЬ
            ИДЕТ...</div>
        <textarea id="voice_text" rows="4" placeholder="Текст вашей речи появится здесь..."></textarea>
    </div>

    <button onclick="sendData()">Отправить врачу</button>
    <div id="status"></div>

    <script>
        // 1. НАСТРОЙКИ FIREBASE (оставь свои)
        const firebaseConfig = {
            apiKey: "AIzaSyBDKqRxh1zuRNkxtPvsqoTyEOpPtxnAP0M",
            authDomain: "://firebaseapp.com",
            projectId: "medformproject",
            databaseURL: "https://medformproject-default-rtdb.firebaseio.com/anketa.json"
        };

        // 2. ЛОГИКА МИКРОФОНА (Ультра-стабильная версия)
        const micBtn = document.getElementById('mic-btn');
        const voiceArea = document.getElementById('voice_text');
        const indicator = document.getElementById('rec-indicator');

        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (Speech) {
            const rec = new Speech();
            rec.lang = 'ru-RU';
            rec.continuous = true;
            rec.interimResults = true;

            let isRecording = false;

            micBtn.onclick = async () => {
                if (!isRecording) {
                    try {
                        // ШАГ 1: Явно запрашиваем доступ у браузера перед стартом записи
                        await navigator.mediaDevices.getUserMedia({ audio: true });

                        // ШАГ 2: Если доступ есть, запускаем распознавание
                        rec.start();
                        isRecording = true;
                        micBtn.classList.add('recording');
                        indicator.style.visibility = 'visible';
                        indicator.innerText = "СЛУШАЮ...";
                        console.log("Запись началась...");
                    } catch (err) {
                        indicator.innerText = "ОШИБКА: Доступ к микрофону заблокирован";
                        console.error("Ошибка доступа:", err);
                    }
                } else {
                    rec.stop();
                    isRecording = false;
                    micBtn.classList.remove('recording');
                    indicator.style.visibility = 'hidden';
                }
            };

            // Исправленный обработчик результата - теперь он точно будет писать в поле
            rec.onresult = (event) => {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i].transcript;
                    }
                }
                if (finalTranscript) {
                    voiceArea.value += (voiceArea.value ? ' ' : '') + finalTranscript.trim() + '.';
                }
            };

            rec.onerror = (event) => {
                console.error("Speech Recognition Error:", event.error);
                if (event.error === 'no-speech') {
                    indicator.innerText = "Голос не распознан, попробуйте еще раз";
                } else {
                    indicator.innerText = "Ошибка: " + event.error;
                    isRecording = false;
                    micBtn.classList.remove('recording');
                }
            };

        } else {
            micBtn.style.display = 'none';
            voiceArea.placeholder = "Браузер не поддерживает распознавание речи.";
        }

        // 3. ОТПРАВКА ДАННЫХ (REST API)
        async function sendData() {
            const status = document.getElementById('status');
            const name = document.getElementById('p_name').value || "Аноним";
            const voice = voiceArea.value; // Берем текст из текстового поля

            const results = [];
            if (document.getElementById('c_pain').value === 'yes') {
                results.push(`Кардио: ${document.getElementById('c_loc').value}, ${document.getElementById('c_char').value}`);
            }

            status.innerText = "⏳ Отправка...";
            status.style.color = "blue";

            try {
                const response = await fetch("https://firebaseio.com/visits.json", {
                    method: "POST",
                    body: JSON.stringify({
                        name: name,
                        results: results,
                        voiceData: voice, // Поле для бабушкиного анамнеза
                        timestamp: Date.now()
                    }),
                    headers: { "Content-Type": "application/json" }
                });

                if (response.ok) {
                    status.innerText = "✅ Успешно доставлено!";
                    status.style.color = "green";
                    voiceArea.value = "";
                }
            } catch (e) {
                status.innerText = "❌ Ошибка сети: " + e.message;
            }
        }

    </script>
</body>

</html>
